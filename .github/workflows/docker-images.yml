name: K8s Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/*.yml'
      - 'images/**'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - name: Build php
      run: docker build . --file images/php/Dockerfile --tag ghcr.io/slapcat/php:latest
    - name: Build rsync
        run: docker build . --file images/rsync/Dockerfile --tag ghcr.io/slapcat/rsync:latest

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push php
      run: docker push ghcr.io/slapcat/php:latest
    - name: Push rsync
        run: docker push ghcr.io/slapcat/rsync:latest
