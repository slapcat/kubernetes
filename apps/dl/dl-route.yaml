apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dl
spec:
  parentRefs:
  - name: http
    namespace: nginx-gateway
  hostnames:
  - "dl.nabasny.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: seerr-seerr-chart
      port: 80
