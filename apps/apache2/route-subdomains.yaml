apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apache
spec:
  parentRefs:
  - name: http
    namespace: nginx-gateway
  hostnames:
  - "jake.nabasny.com"
  - "wiki.nabasny.com"
  - "gutenberg.nabasny.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: apache
      port: 80
