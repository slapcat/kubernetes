apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nabasny
spec:
  parentRefs:
  - name: http
    namespace: nginx-gateway
  hostnames:
  - "nabasny.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: apache
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /grafana
    backendRefs:
    - name: grafana
      namespace: lma
      port: 80
