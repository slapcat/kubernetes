apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik
spec:
  schedule: "30 3 * * 0"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          serviceAccountName: backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: backup
          containers:
          - image: alpine/kubectl
            imagePullPolicy: Always
            name: kubectl
            envFrom:
            - secretRef:
                name: authentik
            volumeMounts:
            - mountPath: "/backup"
              name: backup
            command:
            - /bin/sh
            - -c
            - | 
              kubectl exec -n authentik sts/authentik-postgresql -- pg_dump --dbname="postgresql://backup_user:$PGPASSWORD@127.0.0.1:5432/authentik" > /backup/sql/authentik-$(date -I).sql
          restartPolicy: OnFailure
