apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb
spec:
  schedule: "15 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          serviceAccountName: backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: backup
          containers:
          - image: alpine/kubectl
            imagePullPolicy: Always
            name: kubectl
            envFrom:
            - secretRef:
                name: mariadb
            volumeMounts:
            - mountPath: "/backup"
              name: backup
            command:
            - /bin/sh
            - -c
            - | 
              kubectl exec -n default sts/mariadb -- mariadb-dump --all-databases --single-transaction -u$MARIADB_USER -p$MARIADB_PASSWORD > /backup/sql/mariadb-$(date -I).sql
          restartPolicy: OnFailure
