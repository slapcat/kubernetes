---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: "manual"
  volumeMode: Filesystem
  volumeName: backup
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup
spec:
  storageClassName: "manual"
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Ti
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph-external
    volumeAttributes:
      "fsName": "nabasny"
      "clusterID": "rook-ceph-external"
      "staticVolume": "true"
      "rootPath": "/backups"
    volumeHandle: backup
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
