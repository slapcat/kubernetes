---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etc
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: "manual"
  volumeMode: Filesystem
  volumeName: etc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: etc
spec:
  storageClassName: manual
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/etc"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: microceph
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: "manual"
  volumeMode: Filesystem
  volumeName: microceph
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: microceph
spec:
  storageClassName: manual
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/var/snap/microceph"
