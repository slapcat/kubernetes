---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: box-apps
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: box-apps
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: box-apps
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Gi
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph-external
    volumeAttributes:
      "fsName": "nabasny"
      "clusterID": "rook-ceph-external"
      "staticVolume": "true"
      "rootPath": "/nextcloud/custom_apps"
    volumeHandle: box-apps
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
