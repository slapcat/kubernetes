---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openldap
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: openldap-stack-ha
      version: '4.3.3'
      sourceRef:
        kind: HelmRepository
        name: openldap
      interval: 5m
      valuesFiles:
        - values.yaml
