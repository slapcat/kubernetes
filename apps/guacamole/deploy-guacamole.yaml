---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
      - name: guacamole
        image: guacamole/guacamole
        env:
        - name: GUACD_HOSTNAME
          value: guacd
        - name: GUACD_PORT
          value: "4822"
        - name: OPENID_ENABLED
          value: "true"
        - name: EXTENSION_PRIORITY
          value: "*,openid"
        - name: RDP_GFX_YUV420
          value: "true"
        - name: RDP_GFX_H264
          value: "true"
        envFrom:
        - secretRef:
            name: guacamole
