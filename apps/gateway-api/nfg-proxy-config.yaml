apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: ngf-proxy-config
  namespace: nginx-gateway
spec:
  ipFamily: dual
  kubernetes:
    deployment:
      container:
        image:
          pullPolicy: IfNotPresent
          repository: ghcr.io/nginx/nginx-gateway-fabric/nginx
          tag: 2.9.0
      replicas: 1
    service:
      externalTrafficPolicy: Local
      type: LoadBalancer
  rewriteClientIP:
    mode: XForwardedFor
    trustedAddresses:
    - type: CIDR
      value: 10.0.0.0/8
