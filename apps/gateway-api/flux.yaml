---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
spec:
  interval: 30m0s
  targetNamespace: nginx-gateway
  path: ./apps/gateway-api
  prune: false
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: kubernetes
    namespace: flux-system
  timeout: 3m0s
  wait: true
