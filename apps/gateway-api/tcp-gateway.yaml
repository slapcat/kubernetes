# NOTE: Currently unused since NGF doesn't support proxy_protocol on TCP stream
#       Ideally this will not be a problem on Cilium.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
        group: gateway.nginx.org
        kind: NginxProxy
        name: ngf-proxy-config
