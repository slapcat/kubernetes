# NOTE: Currently unused since NGF doesn't support proxy_protocol on TCP stream
#       Ideally this will not be a problem on Cilium.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
        group: gateway.nginx.org
        kind: NginxProxy
        name: ngf-proxy-config
  listeners:
  - name: ldap
    port: 389
    protocol: TCP
    allowedRoutes:
      namespaces:
        from: All
      kinds:
        - kind: TCPRoute
  - name: ldaps
    port: 636
    protocol: TCP
    allowedRoutes:
      namespaces:
        from: All
      kinds:
        - kind: TCPRoute
  - name: pldap
    port: 8389
    protocol: TCP
    allowedRoutes:
      namespaces:
        from: All
      kinds:
        - kind: TCPRoute
