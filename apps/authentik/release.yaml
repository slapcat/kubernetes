---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: authentik
      version: '6.5.*'
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 5m
  releaseName: authentik
  values:
    authentik:
      existingSecret:
        secretName: authentik
        error_reporting:
            enabled: false
    postgresql:
        enabled: true
    redis:
        enabled: true
