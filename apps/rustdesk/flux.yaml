---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustdesk
spec:
  interval: 30m0s
  targetNamespace: rustdesk
  path: ./apps/rustdesk
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: kubernetes
    namespace: flux-system
  timeout: 3m0s
  wait: true
